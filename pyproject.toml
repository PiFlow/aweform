[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aweform"
version = "0.1.0"
description = "Minimal deterministic substrate for Aweform V0.1"
readme = "README.md"
requires-python = "==3.14.7"
dependencies = [
    "gymnasium>=1.2,<2",
    "matplotlib>=3.10,<4",
    "numpy>=2.3,<3",
]

[project.scripts]
aweform-development = "aweform.runner:main"
aweform-visualize-development = "aweform.visualizer:main"
aweform-visualize = "aweform.development_visualizer:main"
aweform-visualize-d020 = "aweform.development_visualizer:d020_main"
aweform-visualize-d021 = "aweform.development_visualizer:d021_main"
aweform-visualize-d024 = "aweform.development_visualizer:d024_main"
aweform-visualize-d030 = "aweform.development_visualizer:d030_main"
aweform-visualize-d043 = "aweform.development_visualizer:d043_main"
aweform-visualize-d050 = "aweform.development_visualizer:d050_main"
aweform-export-d043-html = "aweform.development_visualizer:d043_html_main"
aweform-export-d053-html = "aweform.development_visualizer:d053_html_main"
aweform-export-vis-d059-html = "aweform.vis_d059:main"
aweform-visualize-exp001 = "aweform.exp001_visualizer:main"
aweform-visualize-exp002 = "aweform.exp002_visualizer:main"
aweform-summarize-calibration = "aweform.calibration:main"
aweform-confirmatory = "aweform.confirmatory:main"
aweform-analyze-confirmatory = "aweform.confirmatory:analysis_main"
aweform-confirm-exp001 = "aweform.exp001_confirmatory:main"
aweform-analyze-exp001-confirmatory = "aweform.exp001_confirmatory:analysis_main"
aweform-calibrate-exp002 = "aweform.exp002_calibration:main"
aweform-visualize-exp003 = "aweform.exp003_visualizer:main"
aweform-visualize-exp003-trend = "aweform.exp003_trend_visualizer:main"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
]
pymunk-probe = [
    "pymunk==7.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aweform"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

# D-060 frozen bytes (executed SHA beb9012, H.7 regeneration check): reformatting
# would invalidate provenance, so only these files get these exact exceptions.
[tool.ruff.lint.per-file-ignores]
"src/aweform/d060.py" = ["E701", "E702", "E501", "F401", "I001", "E741", "E731"]
"src/aweform/d060_oracle.py" = ["E701", "E702", "E501", "F401", "I001", "E741", "E731"]
"tests/test_d060.py" = ["E701", "E702", "E501", "F401", "I001", "E741", "E731"]

[tool.mypy]
python_version = "3.14"
strict = true
